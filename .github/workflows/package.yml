# The release's packaging, smoke-tested on macOS and Linux: a check of the
# release, not of the code, so it is no gate.
name: Package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-latest }
          - { target: linux-x64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: cargo build --release --locked -p atelier-cli
      - run: python scripts/release.py package --target ${{ matrix.target }} --binary target/release/atelier
      - run: python scripts/release.py smoke dist/atelier-*.tar.gz
      - run: python scripts/release.py sums dist
