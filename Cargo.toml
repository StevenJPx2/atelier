[workspace]
resolver = "3"
members = [
  "crates/core",
  "crates/command",
  "crates/git",
  "crates/cli",
  "plugins/github",
  "plugins/opencode",
]

[workspace.package]
version = "0.1.0-rc.6"
edition = "2024"
license = "MIT"
rust-version = "1.96"
publish = false
repository = "https://github.com/StevenJPx2/atelier"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
color-eyre = { version = "0.6", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(kani)"] }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
exit = "deny"
dbg_macro = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
unchecked_time_subtraction = "deny"
as_conversions = "deny"
too_many_lines = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
