name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

env:
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest@0.9.151,cargo-deny@0.20.2,cargo-mutants@27.1.0,cargo-shear@1.14.0,actionlint@1.7.12
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo nextest run --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --doc --all-features --locked
      - run: cargo doc --workspace --all-features --no-deps --locked
      - run: cargo deny check
      - run: cargo shear
      - run: actionlint
      - run: npx --yes prettier@3.9.10 --check crates/README.md scripts/README.md 'docs/**/*.md'
      - name: Mutation tests on the pull request's diff
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git diff --no-ext-diff --no-textconv --no-color "$BASE" -- crates plugins > target/mutants.diff
          cargo mutants --in-diff target/mutants.diff --timeout 120

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.96 --profile minimal
      - run: cargo +1.96 check --workspace --all-targets --all-features --locked

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, os: macos-latest }
          - { target: linux-x64, os: ubuntu-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install ruff==0.17.4
      - run: python -m ruff format --check scripts
      - run: python -m ruff check scripts
      - run: python -m unittest discover -s scripts -v
      - run: cargo build --release --locked -p atelier-cli
      - run: python scripts/release.py package --target ${{ matrix.target }} --binary target/release/atelier
      - run: python scripts/release.py smoke dist/atelier-*.tar.gz
      - run: python scripts/release.py sums dist
