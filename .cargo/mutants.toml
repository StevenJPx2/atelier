# A test anywhere in the workspace can catch a mutant.
test_workspace = true
test_tool = "nextest"
# Kani harnesses run under cargo kani, not nextest.
exclude_globs = ["**/proofs.rs"]
exclude_re = [
  # Built only under cfg(kani), for the proofs; cargo kani checks it.
  'crates/core/src/machine/pipeline\.rs:\d+:\d+: replace Pipeline::unnamed',
  # Equivalent: when the base is the default branch, reading its config again
  # reads the same file the first read did.
  'crates/cli/src/config\.rs:\d+:\d+: replace match guard base != default with true in resolve',
  # Equivalent: a wait that has run exactly its time, to the nanosecond, is
  # not something a test can arrange or a person can notice.
  'crates/cli/src/daemon/poll\.rs:\d+:\d+: replace < with <= in sleep',
]
