name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: darwin-arm64, os: macos-latest, rust: aarch64-apple-darwin }
          - { target: linux-arm64, os: ubuntu-24.04-arm, rust: aarch64-unknown-linux-musl }
          - { target: linux-x64, os: ubuntu-latest, rust: x86_64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: The tag equals the workspace version
        run: test "v$(python scripts/release.py version)" = "$GITHUB_REF_NAME"
      - name: Build a static Linux binary
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add ${{ matrix.rust }}
      - run: cargo build --release --locked -p atelier-cli --target ${{ matrix.rust }}
        env:
          # atelier init pins the CI it writes to this commit.
          ATELIER_COMMIT: ${{ github.sha }}
      - run: python scripts/release.py package --target ${{ matrix.target }} --binary target/${{ matrix.rust }}/release/atelier
      - run: python scripts/release.py smoke dist/atelier-*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: python scripts/release.py sums dist
      - name: Publish the artifacts and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          flags=()
          if [[ "$GITHUB_REF_NAME" == *-rc.* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}" \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME"

  tap:
    needs: publish
    runs-on: macos-latest
    environment: release
    env:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require the tap's dedicated write key
        run: test -n "$TAP_DEPLOY_KEY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: StevenJPx2/homebrew-taps
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Generate the formula from the published checksums
        run: |
          set -euo pipefail
          gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir checksums
          python scripts/release.py formula "${GITHUB_REF_NAME#v}" checksums/SHA256SUMS \
            --out tap/Formula/atelier.rb
      - name: Audit, install and test the real formula
        run: |
          set -euo pipefail
          taps="$(brew --repository)/Library/Taps/stevenjpx2"
          mkdir -p "$taps"
          ln -s "$PWD/tap" "$taps/homebrew-taps"
          brew trust --formula stevenjpx2/taps/atelier
          brew style stevenjpx2/taps/atelier
          brew audit --strict --online --formula stevenjpx2/taps/atelier
          brew install --formula stevenjpx2/taps/atelier
          brew test stevenjpx2/taps/atelier
      - name: Publish the formula
        working-directory: tap
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/atelier.rb
          git commit -m "chore(atelier): ${GITHUB_REF_NAME#v}"
          git push
