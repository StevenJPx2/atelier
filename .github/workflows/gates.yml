# A project's gates, one job each, as atelier gates lists them. Projects
# call it from the .github/workflows/atelier.yml that atelier init writes.
name: gates

on:
  workflow_call:
    inputs:
      atelier:
        description: The atelier release to run, such as 0.1.0-rc.7, or source to build it from the calling repository
        required: true
        type: string

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # atelier fetches the base branch to read the project's config.
          persist-credentials: true
          fetch-depth: 0
      - name: Install atelier
        env:
          ATELIER: ${{ inputs.atelier }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/atelier"
          if [ "$ATELIER" = source ]; then
            cargo build --locked -p atelier-cli
            cp target/debug/atelier "$RUNNER_TEMP/atelier/atelier"
          else
            archive="atelier-$ATELIER-linux-x64.tar.gz"
            gh release download "v$ATELIER" --repo StevenJPx2/atelier \
              --pattern "$archive" --pattern SHA256SUMS --dir "$RUNNER_TEMP/release"
            (cd "$RUNNER_TEMP/release" && sha256sum --check --ignore-missing SHA256SUMS)
            tar -xzf "$RUNNER_TEMP/release/$archive" -C "$RUNNER_TEMP/release" bin/atelier
            cp "$RUNNER_TEMP/release/bin/atelier" "$RUNNER_TEMP/atelier/atelier"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atelier
          path: ${{ runner.temp }}/atelier/atelier
          if-no-files-found: error
      - id: plan
        name: List the gates the changes touch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          atelier="$RUNNER_TEMP/atelier/atelier"
          if [ -n "$BASE" ]; then
            matrix=$("$atelier" gates --json --diff "$BASE")
          else
            matrix=$("$atelier" gates --json)
          fi
          echo "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  gate:
    needs: plan
    if: needs.plan.outputs.matrix != '[]'
    name: ${{ matrix.gate }} (${{ matrix.root }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atelier
          path: ${{ runner.temp }}/atelier
      - name: Run the gate
        env:
          GATE: ${{ matrix.gate }}
          ROOT: ${{ matrix.root }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          atelier="$RUNNER_TEMP/atelier/atelier"
          chmod +x "$atelier"
          diff=()
          if [ -n "$BASE" ]; then
            diff=(--diff "$BASE")
          fi
          "$atelier" check --setup --gate "$GATE" --root "$ROOT" "${diff[@]}"
